<div class="task-list">
  @if (tasks.length === 0) {
    <p class="empty-message">
      No tasks yet. Add one above!
    </p>
  }
  @for (task of tasks; track task.id) {
    <app-task-item
      [task]="task"
      (toggleComplete)="onToggle($event)"
      (deleteTask)="onDelete($event)"
    ></app-task-item>
  }
</div>
