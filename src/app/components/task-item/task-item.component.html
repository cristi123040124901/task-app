<div
  class="task-widget"
  [class.done]="task().done"
>
  <div
    class="task-check"
    (click)="$event.stopPropagation(); onToggle()"
  >
    <svg
      viewBox="0 0 12 12"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <polyline points="2,6 5,9 10,3" />
    </svg>
  </div>

  <div class="task-content">
    <mat-form-field class="task-title">
      <input
        type="email"
        matInput
        [placeholder]="'Today I want to...'"
      />
    </mat-form-field>

    <div class="task-meta">
      <span>{{ task().category }}</span>
      <span class="meta-dot"></span>
      <span
        class="task-priority"
        [class]="priorityClass"
        >{{ priorityLabel }}</span
      >
    </div>
  </div>

  <button
    class="task-delete"
    (click)="$event.stopPropagation(); onDelete()"
    aria-label="Delete task"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
    >
      <line x1="18" y1="6" x2="6" y2="18" />
      <line x1="6" y1="6" x2="18" y2="18" />
    </svg>
  </button>
</div>
